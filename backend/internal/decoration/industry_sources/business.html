<!-- 文件作用说明：按已确认企业设计稿呈现黑白编辑排版、真实混凝土工作室摄影和开放式分屏咨询。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>企业 · 留白咨询工作室</title>
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body data-gc-preview-industry="business">
    <main
      class="gc-layout gc-industry-business business-layout"
      data-gc-edit-id="business-layout"
    >
      <header
        class="gc-brandbar business-brand"
        data-gc-edit-id="business-brand"
      >
        <div class="business-identity" data-gc-edit-id="business-identity">
          <strong data-gc-edit-id="business-brand-name">界点企业咨询</strong>
        </div>
        <div
          class="business-header-actions"
          data-gc-edit-id="business-header-actions"
        >
          <button
            type="button"
            class="gc-leave-message"
            data-gc-action="leave-message"
            data-gc-edit-id="leave-message"
          >
            <img
              class="gc-ui-icon"
              src="static/assets/icon-message.png"
              alt=""
              data-gc-edit-id="business-leave-icon"
            />
            <span data-gc-edit-id="business-leave-label">留下留言</span>
          </button>
          <button
            type="button"
            class="gc-leave-message"
            data-gc-action="evaluation"
            data-gc-edit-id="business-evaluation"
            hidden
          >
            <span data-gc-edit-id="business-evaluation-label">服务评价</span>
          </button>
        </div>
      </header>
      <aside
        class="business-scene gc-decoration"
        aria-label="企业咨询工作室"
        data-gc-edit-id="business-scene"
      >
        <figure
          class="business-photograph"
          data-gc-edit-id="business-photograph"
        >
          <img
            src="static/assets/business-hero.webp"
            alt="日光落在混凝土墙面与工作室桌椅之间"
            data-gc-edit-id="business-hero-image"
          />
        </figure>
        <div
          class="business-introduction"
          data-gc-edit-id="business-introduction"
        >
          <p class="business-eyebrow" data-gc-edit-id="business-eyebrow">
            <span data-gc-edit-id="business-industry-label">企业服务咨询</span>
          </p>
          <h1 data-gc-edit-id="business-title">
            <span data-gc-edit-id="business-title-first">把复杂问题，</span>
            <span data-gc-edit-id="business-title-middle">聊成清晰的</span
            ><span data-gc-edit-id="business-title-last">下一步。</span>
          </h1>
          <nav
            class="business-scope gc-service-entries"
            aria-label="企业咨询方向"
            data-gc-edit-id="business-scope"
          >
            <button
              type="button"
              data-gc-send="我想了解企业服务"
              data-gc-edit-id="business-service"
            >
              <span data-gc-edit-id="business-service-label">服务咨询</span>
            </button>
            <span
              aria-hidden="true"
              data-gc-edit-id="business-scope-separator-one"
              >·</span
            >
            <button
              type="button"
              data-gc-send="我有项目需求想与顾问沟通"
              data-gc-edit-id="business-project"
            >
              <span data-gc-edit-id="business-project-label">项目沟通</span>
            </button>
            <span
              aria-hidden="true"
              data-gc-edit-id="business-scope-separator-two"
              >·</span
            >
            <button
              type="button"
              data-gc-send="我想了解合作沟通方式"
              data-gc-edit-id="business-contact"
            >
              <span data-gc-edit-id="business-contact-label">合作联系</span>
            </button>
          </nav>
        </div>
        <div
          class="business-scene-note gc-secondary"
          data-gc-edit-id="business-scene-note"
        >
          <p
            class="business-note-heading"
            data-gc-edit-id="business-note-heading"
          >
            <span data-gc-edit-id="business-note-number">01</span>
            <span aria-hidden="true" data-gc-edit-id="business-note-divider"
              >/</span
            >
            <span data-gc-edit-id="business-note-label">需求沟通</span>
          </p>
          <p class="business-note-copy" data-gc-edit-id="business-note-copy">
            <span data-gc-edit-id="business-note-first"
              >从真实的业务场景出发</span
            >
            <span data-gc-edit-id="business-note-last"
              >找到可落地的解决方案</span
            >
          </p>
        </div>
      </aside>
      {{CHAT}}
    </main>
    {{SERVICE_DIALOG}} {{SCRIPTS}}
  </body>
</html>
