# 文件作用说明：在GoodChat伪静态配置中引入本片段，以原子更新的文件返回正式地图及已提交的兼容地址。
location = /sitemap.xml {
    try_files /.well-known/sitemap-$host.xml =404;
    types { }
    default_type application/xml;
    gzip off;
    add_header Cache-Control "public, max-age=60";
}

location = /.well-known/sitemap-crawl-check-20261120.xml {
    try_files /.well-known/sitemap-$host.xml =404;
    types { }
    default_type application/xml;
    gzip off;
    add_header Cache-Control "public, max-age=60";
}

location = /indexnow-key.txt {
    try_files /.well-known/indexnow-key.txt =404;
    types { }
    default_type text/plain;
    gzip off;
    add_header Cache-Control "no-store";
}

location = /baidu_verify_codeva-727O8TXyL3.html {
    try_files /app/frontend/public/baidu_verify_codeva-727O8TXyL3.html =404;
    default_type text/html;
}
